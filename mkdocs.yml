site_name: Enterprise Architecture Harness
site_description: A governed, evidence-backed architecture lifecycle.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: amber
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true